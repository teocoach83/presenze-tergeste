function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function dayObj(s){return new Date(s+"T00:00:00")}function fmt(s){return dayObj(s).toLocaleDateString("it-IT",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}function allTrainingDays(){let a=[],d=new Date(start);while(d<=end){if(d.getDay()>=1&&d.getDay()<=6)a.push(key(d));d.setDate(d.getDate()+1)}return a}const trainingDays=allTrainingDays();function currentDay(){const k=key(new Date());return trainingDays.includes(k)?k:trainingDays.find(d=>d>=k)||trainingDays[trainingDays.length-1]}selected=currentDay();function record(ds){if(!state.days[ds])state.days[ds]={globalCancelled:false,excluded:[],absences:{},justified:{}};return state.days[ds]}function excluded(ds,i){return record(ds).excluded.includes(i)}function absence(ds,i){return !!record(ds).absences[i]}function justified(ds,i){return !!record(ds).justified[i]}function stats(i,month=null){let eligible=0,present=0,abs=0,just=0;trainingDays.forEach(ds=>{if(ds>selected||(month&&!ds.startsWith(month)))return;let r=record(ds);if(r.globalCancelled||excluded(ds,i))return;eligible++;if(absence(ds,i)){abs++;if(justified(ds,i))just++}else present++});return{eligible,present,abs,just,pct:eligible?present/eligible*100:100}}function pct(p){return p.toFixed(1).replace(".0","")+"%"}

async function loadCloud(){try{const localRaw=localStorage.getItem(STORAGE);const localState=localRaw?JSON.parse(localRaw):{days:{}};await firebase.auth().signInAnonymously();const snap=await docRef.get();const cloudState=snap.exists&&snap.data().days?{days:snap.data().days}:{days:{}};const merged={days:{}};Object.keys(BACKUP.days).forEach(d=>merged.days[d]=BACKUP.days[d]);Object.keys(cloudState.days||{}).forEach(d=>{if(d>="2026-10-01")merged.days[d]=cloudState.days[d]});Object.keys(localState.days||{}).forEach(d=>{if(d>="2026-10-01")merged.days[d]=localState.days[d]});state=merged;localStorage.setItem(STORAGE,JSON.stringify(state));await docRef.set(state);document.getElementById("status").textContent="✓ Sincronizzato · storico protetto"}catch(e){console.error(e);document.getElementById("status").textContent="⚠️ Firebase non raggiungibile: uso i dati locali"}render()}

function moveDay(d){let n=trainingDays.indexOf(selected)+d;if(n>=0&&n<trainingDays.length){selected=trainingDays[n];render()}}window.moveDay=moveDay;function setPresent(i){let r=record(selected);delete r.absences[i];delete r.justified[i];r.excluded=r.excluded.filter(x=>x!==i);save()}window.setPresent=setPresent;function setAbsent(i,j){let r=record(selected);r.absences[i]=true;if(j)r.justified[i]=true;else delete r.justified[i];r.excluded=r.excluded.filter(x=>x!==i);save()}window.setAbsent=setAbsent;function setExcluded(i){let r=record(selected);if(r.excluded.includes(i))r.excluded=r.excluded.filter(x=>x!==i);else{r.excluded.push(i);delete r.absences[i];delete r.justified[i]}save()}window.setExcluded=setExcluded;function allPresent(){let r=record(selected);r.absences={};r.justified={};r.excluded=[];r.globalCancelled=false;save()}window.allPresent=allPresent;function setGlobalCancel(){let r=record(selected);r.globalCancelled=!r.globalCancelled;if(r.globalCancelled){r.absences={};r.justified={};r.excluded=[]}save()}window.setGlobalCancel=setGlobalCancel;
