<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18202a"><title>TERGESTE — Presenze</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f4f6f8}button{font:inherit;border:0;cursor:pointer}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e8ec;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.14em;font-size:18px}.sub{font-size:12px;color:#737d89}.ghost{background:#eef1f4;padding:9px 13px;border-radius:10px;font-weight:800}main{max-width:760px;margin:auto;padding:12px 14px 28px}.tabs{display:flex;gap:5px;background:#e8ebef;padding:5px;border-radius:14px;margin-bottom:12px;position:sticky;top:64px;z-index:8}.tab{flex:1;padding:10px 6px;border-radius:10px;background:transparent;color:#68727e;font-weight:800}.tab.active{background:#fff;color:#18202a;box-shadow:0 1px 5px #0001}.hero{background:#fff;border-radius:17px;padding:16px;box-shadow:0 2px 12px #0000000a}.heroTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.date{font-size:20px;font-weight:900;text-transform:capitalize}.date small{display:block;font-size:12px;color:#78828d;font-weight:500;margin-top:3px}.nav{display:flex;gap:6px}.nav button{width:38px;height:38px;border-radius:11px;background:#eef1f4;font-size:24px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.kpi{background:#f5f6f8;border-radius:12px;padding:10px}.kpi span{display:block;color:#737d88;font-size:11px}.kpi b{display:block;font-size:20px;margin-top:3px}.red{color:#c53535!important}.actions{display:flex;gap:7px;margin:10px 0}.actions button{flex:1;padding:11px;border-radius:11px;font-weight:850}.primary{background:#18202a;color:#fff}.dangerBtn{background:#ffe8e8;color:#b52d2d}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 7px}.sectionTitle h2{font-size:15px;margin:0}.sectionTitle span{font-size:11px;color:#7a838e}.list{display:grid;gap:7px}.athlete{background:#fff;border:1px solid #e8ebef;border-radius:14px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:9px}.athlete.warn{border-color:#efc1c1}.athlete.excluded{opacity:.62}.person{min-width:0}.person b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;font-size:10px;color:#7b8590;margin-top:3px}.statuses{display:flex;gap:5px;flex-shrink:0}.status{min-width:70px;padding:9px 7px;border-radius:10px;background:#edf0f3;font-size:11px;font-weight:800}.status.abs{background:#ffe8e8;color:#b52d2d}.status.ok{background:#eaf2ec;color:#2f6541}.more{background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:10px;margin-top:9px}.more summary{cursor:pointer;font-weight:800;font-size:12px;color:#555f6a}.moreGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.moreGrid button{padding:8px 4px;border-radius:9px;background:#f0f2f4;font-size:10px;font-weight:750}.note{font-size:11px;color:#7b8490;line-height:1.45;margin:8px 2px}.cards{display:grid;gap:8px}.card{background:#fff;border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:3px;border:1px solid #e7eaee}.card strong{font-size:24px}.card span{grid-column:1/-1;font-size:11px;color:#78818c}.dangerCard{border-color:#efc1c1}.tableWrap{overflow:auto;background:#fff;border-radius:14px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px;border-bottom:1px solid #eceef1;text-align:center;font-size:11px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.calendar{display:grid;gap:12px}.calendar section{background:#fff;border-radius:14px;padding:12px}.calendar h3{margin:2px 0 8px;text-transform:capitalize}.day{display:flex;width:100%;align-items:center;gap:11px;text-align:left;padding:9px;border-radius:9px;background:#f4f5f7;margin:4px 0}.day span{font-weight:900;width:25px}.day div{font-size:11px}.day.off{background:#eceef0;color:#858b92}@media(max-width:520px){main{padding:10px}.kpi b{font-size:17px}.athlete{align-items:flex-start}.status{min-width:66px}}</style></head><body><div id="app"></div><script>const athletes=["Matteo Agosti", "Francesco Grassilli", "Giulio Turisini", "Mykyta Krasutsky", "Martina Babic", "Sveva Bibalo", "Sofia Reia", "Tommaso Borini", "Greta Mengucci", "Cloe Ruttar", "Rachele Pavoni", "Angelica Collari"];
const start=new Date("2026-09-14T00:00:00"),end=new Date("2027-08-09T00:00:00");
const STORAGE="tergeste-presenze-v1";
const html={escape:s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))};
let state=JSON.parse(localStorage.getItem(STORAGE)||'{"days":{}}');
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dayObj(s){return new Date(s+"T00:00:00")}
function fmt(s){return dayObj(s).toLocaleDateString("it-IT",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
function record(ds){if(!state.days[ds])state.days[ds]={globalCancelled:false,excluded:[],absences:{},justified:{}};return state.days[ds]}
function allTrainingDays(){let a=[],d=new Date(start);while(d<=end){if(d.getDay()>=1&&d.getDay()<=6)a.push(key(d));d.setDate(d.getDate()+1)}return a}
const trainingDays=allTrainingDays();
function stats(i,month=null){let eligible=0,present=0,abs=0,just=0;trainingDays.forEach(ds=>{if(month&&!ds.startsWith(month))return;let r=record(ds);if(r.globalCancelled||r.excluded.includes(i))return;eligible++;if(r.absences[i]){abs++;if(r.justified[i])just++}else present++});return{eligible,present,abs,just,pct:eligible?present/eligible*100:100}}
function pct(p){return p.toFixed(1).replace(".0","")+"%"}
function currentDay(){let n=new Date(),k=key(new Date(n.getFullYear(),n.getMonth(),n.getDate()));if(trainingDays.includes(k))return k;return trainingDays.find(d=>d>=k)||trainingDays[trainingDays.length-1]}
let selected=currentDay(),tab="today";
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));render()}
function render(){document.querySelector("#app").innerHTML=`<header><div><div class="brand">TERGESTE</div><div class="sub">Registro presenze</div></div><button class="ghost" onclick="exportData()">Esporta</button></header><main><section class="tabs"><button class="tab ${tab==="today"?"active":""}" onclick="showTab('today')">Allenamento</button><button class="tab ${tab==="athletes"?"active":""}" onclick="showTab('athletes')">Atleti</button><button class="tab ${tab==="calendar"?"active":""}" onclick="showTab('calendar')">Calendario</button></section><div id="content"></div></main>`;if(tab==="today")renderToday();else if(tab==="athletes")renderAthletes();else renderCalendar()}
function renderToday(){let r=record(selected),month=selected.slice(0,7),below=athletes.filter((_,i)=>stats(i).pct<90).length,abs=athletes.filter((_,i)=>r.absences[i]).length;document.querySelector("#content").innerHTML=`<section class="hero"><div class="heroTop"><div class="date">${fmt(selected)}<small>${r.globalCancelled?"Allenamento annullato per tutti":"6 allenamenti settimanali · uno al giorno"}</small></div><div class="nav"><button onclick="moveDay(-1)">‹</button><button onclick="moveDay(1)">›</button></div></div><div class="kpis"><div class="kpi"><span>Presenti oggi</span><b>${r.globalCancelled?"—":athletes.length-abs-r.excluded.length}/${athletes.length}</b></div><div class="kpi"><span>Sotto 90%</span><b class="${below?"red":""}">${below}</b></div><div class="kpi"><span>Mese</span><b>${new Date(month+"-01").toLocaleDateString("it-IT",{month:"short"})}</b></div></div></section><div class="actions"><button class="primary" onclick="allPresent()">Tutti presenti</button><button class="dangerBtn" onclick="setGlobalCancel()">${r.globalCancelled?"Ripristina":"Annulla per tutti"}</button></div><div class="sectionTitle"><h2>Presenze</h2><span>Segna solo le assenze</span></div><div class="list">${athletes.map((a,i)=>{let ex=r.excluded.includes(i),ab=!!r.absences[i],ju=!!r.justified[i],s=stats(i),m=stats(i,month);return `<div class="athlete ${s.pct<90?"warn":""} ${ex?"excluded":""}"><div class="person"><b>${html.escape(a)}</b><small>Mese ${pct(m.pct)} · Stagione ${pct(s.pct)} ${s.pct<90?"· SOTTO 90%":""}</small></div><div class="statuses"><button class="status ${ab?"abs":"ok"}" onclick="setAbsent(${i},false)">${ab&&!ju?"Assente":"Presente"}</button><button class="status ${ju?"abs":"ok"}" onclick="setAbsent(${i},true)">${ju?"Giust.":"Giustifica"}</button></div></div>`}).join("")}</div><details class="more"><summary>Altre azioni per atleta</summary><div class="moreGrid">${athletes.map((a,i)=>`<button onclick="setExcluded(${i})">${r.excluded.includes(i)?"Riattiva":"Escludi"} · ${html.escape(a.split(" ")[0])}</button>`).join("")}</div><p class="note">Un'assenza, anche giustificata, incide sulla percentuale. "Escludi" invece rimuove quell'allenamento dal conteggio del singolo atleta.</p></details>`}
window.showTab=t=>{tab=t;render()};window.moveDay=d=>{let n=trainingDays.indexOf(selected)+d;if(n>=0&&n<trainingDays.length){selected=trainingDays[n];render()}}
window.setPresent=i=>{let r=record(selected);delete r.absences[i];delete r.justified[i];r.excluded=r.excluded.filter(x=>x!==i);save()}
window.setAbsent=(i,j)=>{let r=record(selected);r.absences[i]=true;if(j)r.justified[i]=true;else delete r.justified[i];r.excluded=r.excluded.filter(x=>x!==i);save()}
window.setExcluded=i=>{let r=record(selected);if(r.excluded.includes(i))r.excluded=r.excluded.filter(x=>x!==i);else{r.excluded.push(i);delete r.absences[i];delete r.justified[i]}save()}
window.allPresent=()=>{let r=record(selected);r.absences={};r.justified={};r.excluded=[];r.globalCancelled=false;save()}
window.setGlobalCancel=()=>{let r=record(selected);r.globalCancelled=!r.globalCancelled;if(r.globalCancelled){r.absences={};r.justified={};r.excluded=[]}save()}
function renderAthletes(){let months=[...new Set(trainingDays.map(x=>x.slice(0,7)))];document.querySelector("#content").innerHTML=`<h2>Situazione atleti</h2><p class="note">Soglia obbligatoria: <b>90%</b>. Gli annullamenti e le esclusioni individuali non entrano nel denominatore.</p><div class="cards">${athletes.map((a,i)=>{let s=stats(i);return `<div class="card ${s.pct<90?"dangerCard":""}"><div><b>${html.escape(a)}</b></div><strong class="${s.pct<90?"red":""}">${pct(s.pct)}</strong><span>${s.present} presenze · ${s.abs} assenze · ${s.eligible} allenamenti conteggiati</span></div>`}).join("")}</div><h3>Dettaglio mensile</h3><div class="tableWrap"><table><thead><tr><th>Atleta</th>${months.map(m=>`<th>${new Date(m+"-01").toLocaleDateString("it-IT",{month:"short"})}</th>`).join("")}<th>Stagione</th></tr></thead><tbody>${athletes.map((a,i)=>`<tr><td>${html.escape(a)}</td>${months.map(m=>{let s=stats(i,m);return `<td class="${s.pct<90?"red":""}">${pct(s.pct)}</td>`}).join("")}<td class="${stats(i).pct<90?"red":""}"><b>${pct(stats(i).pct)}</b></td></tr>`).join("")}</tbody></table></div>`}
function renderCalendar(){let byMonth={};trainingDays.forEach(d=>(byMonth[d.slice(0,7)]??=[]).push(d));document.querySelector("#content").innerHTML=`<h2>Calendario</h2><p class="note">Tocca una giornata per registrare o correggere le presenze.</p><div class="calendar">${Object.entries(byMonth).map(([m,days])=>`<section><h3>${new Date(m+"-01").toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</h3>${days.map(d=>{let r=record(d),n=athletes.filter((_,i)=>r.absences[i]).length,x=r.excluded.length;return `<button class="day ${r.globalCancelled?"off":""}" onclick="openDay('${d}')"><span>${new Date(d+"T00:00:00").getDate()}</span><div>${r.globalCancelled?"Allenamento annullato":n?`${n} assenz${n===1?"a":"e"}${x?" · "+x+" esclusi":""}`:x?`Tutti presenti · ${x} esclusi`:"Tutti presenti"}</div></button>`}).join("")}</section>`).join("")}</div>`}
window.openDay=d=>{selected=d;tab="today";render()};window.exportData=()=>{let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="presenze-tergeste-backup.json";a.click()};render();</script></body></html>
