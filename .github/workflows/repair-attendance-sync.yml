name: Repair attendance sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair load and preserve attendance history
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'SYNC_REPAIR_V3' in s:
              print('Repair already applied')
              raise SystemExit(0)

          pattern = re.compile(r'async function loadCloud\(\)\{.*?\}\nfunction render\(\)', re.S)
          replacement = '''async function loadCloud(){try{const localRaw=localStorage.getItem(STORAGE);const localState=localRaw?JSON.parse(localRaw):{days:{}};await firebase.auth().signInAnonymously();let s=await docRef.get();let cloudState=s.exists&&s.data().days?{days:s.data().days}:{days:{}};let merged={days:{}};Object.keys(BACKUP.days||{}).forEach(d=>merged.days[d]=BACKUP.days[d]);Object.keys(cloudState.days||{}).forEach(d=>{if(d>="2026-10-02")merged.days[d]=cloudState.days[d]});Object.keys(localState.days||{}).forEach(d=>{if(d>="2026-10-02")merged.days[d]=localState.days[d]});state=merged;localStorage.setItem(STORAGE,JSON.stringify(state));await docRef.set(state);document.getElementById("status").textContent="✓ Sincronizzato con Firebase · storico protetto"}catch(e){console.error(e);document.getElementById("status").textContent="⚠️ Firebase non configurato: attivo salvataggio locale"}render()}/* SYNC_REPAIR_V3 */
function render()'''

          if not pattern.search(s):
              raise SystemExit('Target loadCloud block not found')

          s2 = pattern.sub(replacement, s, count=1)
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "repair attendance sync"
          git push
